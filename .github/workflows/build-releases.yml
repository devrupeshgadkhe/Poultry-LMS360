name: Build Releases (.exe & .apk)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build App & Pack Windows Installer (.exe)
        run: |
          npm run electron:pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Poultry-LMS-360-Windows-Setup
          path: dist-desktop/*.exe

      - name: Publish GitHub Release with .exe Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
          tag_name: v1.0.${{ github.run_number }}
          name: "Poultry LMS 360 v1.0.${{ github.run_number }} (Windows & Web Release)"
          body: |
            ### 🚀 Poultry LMS 360 - Official Professional Release
            - **Windows Installer (.exe):** Attached below with custom professional icon and Supabase cloud integration.
            - **Cloud Database:** Fully synchronized with Supabase Cloud (Zero local storage dependency).
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
